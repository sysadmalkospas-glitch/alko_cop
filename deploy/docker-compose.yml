# Запуск сервера: docker compose --env-file .env up -d
# Перед первым запуском скопируйте .env.example в .env и задайте пароли.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: alkocop
      POSTGRES_USER: alkocop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alkocop -d alkocop"]
      interval: 10s
      retries: 5

  server:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALKOCOP_DATABASE_URL: postgresql+psycopg://alkocop:${POSTGRES_PASSWORD}@db:5432/alkocop
      ALKOCOP_ENROLL_KEY: ${ALKOCOP_ENROLL_KEY:?set ALKOCOP_ENROLL_KEY in .env}
      ALKOCOP_AUTH_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: ${ALKOCOP_PROXY_IP:-172.30.240.2}
    volumes:
      # Скриншоты лежат на отдельном диске сервера: путь задаётся в .env.
      - ${SCREENSHOT_PATH:-./data/screenshots}:/data/screenshots
    networks:
      - db_net
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.${ALKOCOP_TLS_MODE:-internal}", "--adapter", "caddyfile"]
    environment:
      ALKOCOP_HOST: ${ALKOCOP_HOST:-alkocop.internal}
    ports:
      - "${ALKOCOP_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${ALKOCOP_CERTS_DIR:-./certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy_net:
        ipv4_address: ${ALKOCOP_PROXY_IP:-172.30.240.2}

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  db_net:
    internal: true
  proxy_net:
    ipam:
      config:
        - subnet: ${ALKOCOP_PROXY_SUBNET:-172.30.240.0/24}
