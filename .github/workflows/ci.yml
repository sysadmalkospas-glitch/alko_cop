name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ALKOCOP_ENROLL_KEY: ci-only-enroll
      SCREENSHOT_PATH: ${{ github.workspace }}/deploy/data/ci-screenshots
      ALKOCOP_HOST: localhost
      ALKOCOP_HTTPS_PORT: "18443"
      ALKOCOP_CERTS_DIR: ${{ github.workspace }}/deploy/data/ci-certs
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check HTTPS, authentication and PostgreSQL migrations
        working-directory: deploy
        run: bash ci-https-smoke.sh
      - name: Stop migration test containers
        if: always()
        working-directory: deploy
        run: docker compose -p alkocop-migration-ci down -v

  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build AlkoCop.Agent.slnx -c Release
      - run: dotnet test AlkoCop.Agent.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
