name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check migrations on fresh PostgreSQL
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: ci-only-password
          ALKOCOP_ENROLL_KEY: ci-only-enroll
          SCREENSHOT_PATH: ${{ runner.temp }}/alkocop-ci-screenshots
          SERVER_PORT: "18000"
        run: |
          install -d -m 0777 "$SCREENSHOT_PATH"
          docker compose -p alkocop-migration-ci up -d --build
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:18000/health
          docker compose -p alkocop-migration-ci exec -T server alembic check
      - name: Stop migration test containers
        if: always()
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: ci-only-password
          ALKOCOP_ENROLL_KEY: ci-only-enroll
          SCREENSHOT_PATH: ${{ runner.temp }}/alkocop-ci-screenshots
          SERVER_PORT: "18000"
        run: docker compose -p alkocop-migration-ci down -v

  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build AlkoCop.Agent.slnx -c Release
      - run: dotnet test AlkoCop.Agent.slnx -c Release --no-build

